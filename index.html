<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Gestor de Tareas Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        .task-enter {
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from {
                transform: translateX(-20px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        .task-exit {
            animation: fadeOut 0.3s ease-out;
        }
        @keyframes fadeOut {
            to {
                opacity: 0;
            }
        }
    </style>
</head>
<body class="bg-gray-900 min-h-screen text-gray-100">
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <div class="bg-gray-800 rounded-xl shadow-2xl p-6">
            <header class="mb-6">
                <h1 class="text-3xl font-bold text-white mb-2">TaskFlow</h1>
                <p class="text-gray-400">Organiza tu día de manera eficiente</p>
            </header>

            <div class="flex gap-2 mb-6">
                <select id="taskFilter" class="bg-gray-700 text-white rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="all">Todas las tareas</option>
                    <option value="active">Activas</option>
                    <option value="completed">Completadas</option>
                    <option value="starred">Importantes</option>
                </select>
                <button id="clearCompleted" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg transition-colors">
                    Limpiar completadas
                </button>
            </div>

            <div class="space-y-4">
                <div class="flex gap-2">
                    <input type="text" id="todoInput" 
                           class="flex-1 bg-gray-700 text-white rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                           placeholder="Nueva tarea...">
                    <button id="addButton" 
                            class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition-colors">
                        Agregar
                    </button>
                </div>

                <div class="mt-4">
                    <ul id="todoList" class="space-y-2"></ul>
                </div>
            </div>

            <div class="mt-6 pt-4 border-t border-gray-700">
                <p id="taskStats" class="text-sm text-gray-400">
                    0 tareas pendientes
                </p>
            </div>
        </div>
    </div>

    <script>
        class TaskManager {
            constructor() {
                this.tasks = JSON.parse(localStorage.getItem('tasks')) || [];
                this.todoInput = document.getElementById('todoInput');
                this.addButton = document.getElementById('addButton');
                this.todoList = document.getElementById('todoList');
                this.taskFilter = document.getElementById('taskFilter');
                this.clearCompleted = document.getElementById('clearCompleted');
                this.taskStats = document.getElementById('taskStats');
                
                this.setupEventListeners();
                this.renderTasks();
                this.updateStats();
            }

            setupEventListeners() {
                this.addButton.addEventListener('click', () => this.addTask());
                this.todoInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.addTask();
                });
                this.taskFilter.addEventListener('change', () => this.renderTasks());
                this.clearCompleted.addEventListener('click', () => this.clearCompletedTasks());
            }

            addTask() {
                const text = this.todoInput.value.trim();
                if (!text) return;

                const task = {
                    id: Date.now(),
                    text,
                    completed: false,
                    starred: false,
                    createdAt: new Date().toISOString()
                };

                this.tasks.unshift(task);
                this.saveToLocalStorage();
                this.renderTasks();
                this.todoInput.value = '';
                this.updateStats();
            }

            toggleTaskStatus(id, property) {
                const task = this.tasks.find(t => t.id === id);
                if (task) {
                    task[property] = !task[property];
                    this.saveToLocalStorage();
                    this.renderTasks();
                    this.updateStats();
                }
            }

            deleteTask(id) {
                const taskElement = document.querySelector(`[data-task-id="${id}"]`);
                taskElement.classList.add('task-exit');
                
                setTimeout(() => {
                    this.tasks = this.tasks.filter(t => t.id !== id);
                    this.saveToLocalStorage();
                    this.renderTasks();
                    this.updateStats();
                }, 300);
            }

            clearCompletedTasks() {
                this.tasks = this.tasks.filter(t => !t.completed);
                this.saveToLocalStorage();
                this.renderTasks();
                this.updateStats();
            }

            saveToLocalStorage() {
                localStorage.setItem('tasks', JSON.stringify(this.tasks));
            }

            getFilteredTasks() {
                const filter = this.taskFilter.value;
                switch(filter) {
                    case 'active':
                        return this.tasks.filter(t => !t.completed);
                    case 'completed':
                        return this.tasks.filter(t => t.completed);
                    case 'starred':
                        return this.tasks.filter(t => t.starred);
                    default:
                        return this.tasks;
                }
            }

            renderTasks() {
                const filteredTasks = this.getFilteredTasks();
                this.todoList.innerHTML = '';

                filteredTasks.forEach(task => {
                    const li = document.createElement('li');
                    li.dataset.taskId = task.id;
                    li.className = 'task-enter flex items-center gap-3 bg-gray-700 p-3 rounded-lg';
                    
                    li.innerHTML = `
                        <button class="w-5 h-5 rounded-full border-2 flex items-center justify-center ${
                            task.completed 
                                ? 'bg-green-500 border-green-500' 
                                : 'border-gray-400 hover:border-green-500'
                        }" onclick="taskManager.toggleTaskStatus(${task.id}, 'completed')">
                            ${task.completed ? '<svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>' : ''}
                        </button>
                        <span class="flex-1 ${task.completed ? 'line-through text-gray-400' : ''}">${task.text}</span>
                        <button class="text-xl ${task.starred ? 'text-yellow-400' : 'text-gray-400 hover:text-yellow-400'}"
                                onclick="taskManager.toggleTaskStatus(${task.id}, 'starred')">
                            ${task.starred ? '★' : '☆'}
                        </button>
                        <button class="text-gray-400 hover:text-red-500"
                                onclick="taskManager.deleteTask(${task.id})">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                            </svg>
                        </button>
                    `;
                    
                    this.todoList.appendChild(li);
                });
            }

            updateStats() {
                const pendingTasks = this.tasks.filter(t => !t.completed).length;
                this.taskStats.textContent = `${pendingTasks} tarea${pendingTasks !== 1 ? 's' : ''} pendiente${pendingTasks !== 1 ? 's' : ''}`;
            }
        }

        const taskManager = new TaskManager();
    </script>
</body>
</html>
